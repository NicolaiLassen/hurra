[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: let React Router handle /join/..., /play/..., /admin/... etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
