[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: let React Router handle /join/..., /play/..., /host/... etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Vite puts a hash of its content in every file name under /assets, so a reload
# or a second scan of the QR code needs nothing from the network for them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sounds keep their names, so unlike /assets they can't be cached forever. A
# day fresh, then a week of playing the cached copy while the browser checks
# for a new one in the background, so a reload never waits on the network for
# its sounds. The app then decodes them into memory, as before.
[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
