<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- display "browser": a home-screen icon opens in the normal browser, which
         shares localStorage, so guests stay the same player. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Archivo, the on-air voice (src/index.css): its Latin file (ø, æ and å
         included) starts downloading with the page, before the stylesheet asks
         for it. The build swaps in the hashed file the stylesheet uses. -->
    <link rel="preload" href="/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110E" />
    <!-- Dark from the very first paint, before the stylesheet arrives (in dev it
         comes with the scripts), so a reload never blinks white. -->
    <meta name="color-scheme" content="dark" />
    <style>html, body { background: #14110e; color-scheme: dark; }</style>
    <title>Hurra</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The app's one loader, outside #root so React never replaces it: up from
         the first paint until the first screen has its data, then reused for
         loads inside the app (src/lib/loader.ts). -->
    <div id="splash" class="splash" data-state="boot" role="status">
      <div class="confetti-loader" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <span class="sr-only">Loading</span>
      <div class="splash-slow" hidden>
        <p>This is taking longer than usual.</p>
        <button type="button">Retry</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
